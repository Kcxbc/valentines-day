<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff69b4, #ff1493, #ff69b4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ff1493;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 40px;
            min-height: 60px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .yes-btn {
            background-color: #ff1493;
            color: white;
            padding: 20px 60px;
            font-size: 1.3em;
        }

        .yes-btn:hover {
            background-color: #ff69b4;
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(255, 20, 147, 0.4);
        }

        .no-btn {
            background-color: #808080;
            color: white;
            padding: 15px 40px;
            font-size: 1.1em;
        }

        .no-btn:hover {
            background-color: #606060;
            transform: scale(1.05);
        }

        /* Celebration Screen */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff69b4, #ffb6d9, #ff1493);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .celebration h1 {
            font-size: 4em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .picture-container {
            margin: 30px 0;
            max-width: 500px;
        }

        .picture-container img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 5px solid white;
        }

        .celebration-text {
            font-size: 2em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 30px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Fireworks */
        .firework {
            position: fixed;
            pointer-events: none;
        }

        .firework-particle {
            position: absolute;
            background: radial-gradient(circle, #ffff00, #ff69b4);
            border-radius: 50%;
            pointer-events: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h1>❤️ Will You Be My Valentine? ❤️</h1>
        <div class="question" id="question">
            I have a question for you...
        </div>
        <div class="buttons">
            <button class="yes-btn" id="yesBtn">Yes! 💕</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>
    </div>

    <div class="celebration hidden" id="celebration">
        <h1>YAAAAAAYYYYYY!!! 🎉</h1>
        <div class="picture-container">
            <!-- Replace with your actual picture URL -->
            <img id="couplePhoto" src="Flower.jpg" alt="Us">
        </div>
        <div class="celebration-text">You make me so happy! 💕</div>
    </div>

    <script>
        let noCount = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const mainContainer = document.getElementById('mainContainer');
        const celebration = document.getElementById('celebration');

        const noMessages = [
            "Are you sure? 🥺",
            "Are you positive? 💔",
            "Really? 😢",
            "Come on... 💕",
            "Just yes already 😍",
            "Please? 🙏",
            "I'm waiting... ⏳",
            "Say yes! 💕",
            "You know you want to 😉",
            "Stop being shy! 🥰"
        ];

        noBtn.addEventListener('click', () => {
            // Cycle through messages continuously
            const messageIndex = noCount % noMessages.length;
            question.textContent = noMessages[messageIndex];
            noCount++;
            
            // Make the No button progressively smaller, but never disappear
            const sizeFactor = Math.max(0.3, 1 - (noCount * 0.08));
            noBtn.style.padding = `${15 * sizeFactor}px ${40 * sizeFactor}px`;
            noBtn.style.fontSize = `${1.1 * sizeFactor}em`;
        });

        yesBtn.addEventListener('click', () => {
            mainContainer.classList.add('hidden');
            celebration.classList.remove('hidden');
            createFireworks();
        });

        // Fireworks function
        function createFireworks() {
            const celebrationDiv = celebration;
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createFirework(x, y);
                }, i * 100);
            }
        }

        function createFirework(x, y) {
            const colors = ['#ff1493', '#ff69b4', '#ffb6d9', '#ffff00', '#ff6347', '#00bfff'];
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = (Math.random() * 8 + 3) + 'px';
                particle.style.height = particle.style.width;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const angle = (i / particleCount) * Math.PI * 2;
                const velocity = 5 + Math.random() * 8;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                let posX = x;
                let posY = y;
                let velX = vx;
                let velY = vy;

                document.body.appendChild(particle);

                const animate = () => {
                    velY += 0.2; // gravity
                    posX += velX;
                    posY += velY;

                    particle.style.left = posX + 'px';
                    particle.style.top = posY + 'px';
                    particle.style.opacity = 1 - (posY - y) / 400;

                    if (posY < window.innerHeight) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                    }
                };

                animate();
            }
        }
    </script>
</body>
</html>
